spring.application.name=afutbolweb

# Puerto: Railway da el suyo; en el PC se usa 8080
server.port=${PORT:8080}

# Conexión: si Railway da un valor, se usa ese; si no, el que está después de los dos puntos
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:afutbol}
spring.datasource.username=${MYSQLUSER:root}

# La contraseña se lee desde secrets.properties (PC) o desde Railway
spring.config.import=optional:classpath:secrets.properties
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true